main:
  steps:
    # Step 1: Submit BigQuery job.
    # Placeholder: SELECT 1 confirms the SA has BQ job submission rights.
    # Replace with the full SQL pipeline steps once SA has dataViewer on source datasets.
    - run_bq_placeholder:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: "agentic-platforms-sandbox"
          body:
            jobReference:
              projectId: "agentic-platforms-sandbox"
              location: "australia-southeast1"
            configuration:
              query:
                query: "SELECT 1"
                useLegacySql: false
                location: "australia-southeast1"
        result: bq_job_response

    # Step 2: Wait for the BQ job using the native connector.
    # getQueryResults blocks up to timeoutMs (3 min) server-side before returning.
    # If the job is not done within 3 min, jobComplete is false and we retry --
    # no sleep needed. BQ errors surface as Workflows exceptions automatically.
    - poll_bq_job:
        steps:
          - check_bq_status:
              call: googleapis.bigquery.v2.jobs.getQueryResults
              args:
                projectId: "agentic-platforms-sandbox"
                jobId: ${bq_job_response.jobReference.jobId}
                location: "australia-southeast1"
                timeoutMs: 180000
              result: bq_job_status
          - evaluate_bq_status:
              switch:
                - condition: ${bq_job_status.jobComplete == true}
                  next: generate_briefs_parallel
                - condition: true
                  next: check_bq_status

    # Step 3: Query vendor_scores for the top 10 vendors by anomaly score.
    # Uses the synchronous jobs.query API — fast for a small result set.
    # Update LIMIT to change how many briefs are generated per pipeline run.
    - query_top_vendors:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: "agentic-platforms-sandbox"
          body:
            query: >
              SELECT vendor_number
              FROM `agentic-platforms-sandbox.fraud.vendor_scores`
              ORDER BY anomaly_score DESC
              LIMIT 10
            useLegacySql: false
            location: "australia-southeast1"
            timeoutMs: 60000
        result: vendors_result

    # Step 3b: Extract vendor_number strings from BQ row format.
    # BQ returns rows as [{f: [{v: "VEN001"}]}, ...] — map to a plain list.
    # Guard: BQ omits the "rows" key entirely when the query returns no results.
    - extract_vendor_ids:
        assign:
          - vendor_ids: []
    - check_vendors_exist:
        switch:
          - condition: ${not("rows" in vendors_result)}
            next: return_results
    - build_vendor_list:
        for:
          value: row
          in: ${vendors_result.rows}
          steps:
            - append_vendor:
                assign:
                  - vendor_ids: ${list.concat(vendor_ids, [row.f[0].v])}

    # Step 4: Fan out brief generation. One Cloud Run call per vendor, in parallel.
    - generate_briefs_parallel:
        parallel:
          for:
            value: vendor_id
            in: ${vendor_ids}
            steps:
              - call_brief_service:
                  call: http.post
                  args:
                    url: "https://fraud-case-brief-747682583836.australia-southeast1.run.app/generate"
                    auth:
                      type: OIDC
                    headers:
                      Content-Type: "application/json"
                    body:
                      vendor_id: ${vendor_id}
                  result: brief_response

    # Step 5: Return summary
    - return_results:
        return:
          bq_status: ${bq_job_status.jobComplete}
          brief_status: "parallel fan-out complete"
          vendors_briefed: ${vendor_ids}